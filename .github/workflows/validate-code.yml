# Workflow per validazione codice multi-linguaggio
# Auto-generated by Elite DevPortal AI Agent
#
# Supporta:
# - Java (Maven/Gradle)
# - JavaScript/TypeScript (npm/yarn)
# - Python (pip/pipenv/poetry)
# - Go
# - Rust (Cargo)
# - C# (.NET)

name: Validate Code

on:
  workflow_dispatch:
    inputs:
      command_type:
        description: 'Type of command (compile, test, lint, build)'
        required: true
        type: string
      command:
        description: 'Actual command to execute'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== JAVA SETUP =====
      - name: Setup Java (if needed)
        if: contains(inputs.command, 'mvn') || contains(inputs.command, 'gradle')
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Gradle (if needed)
        if: contains(inputs.command, 'gradle')
        uses: gradle/actions/setup-gradle@v3

      # ===== NODE.JS SETUP =====
      - name: Setup Node.js (if needed)
        if: contains(inputs.command, 'npm') || contains(inputs.command, 'yarn') || contains(inputs.command, 'pnpm')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies (if needed)
        if: contains(inputs.command, 'npm') || contains(inputs.command, 'yarn')
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          elif [ -f "package.json" ]; then
            npm install
          fi

      # ===== PYTHON SETUP =====
      - name: Setup Python (if needed)
        if: contains(inputs.command, 'python') || contains(inputs.command, 'pip') || contains(inputs.command, 'pytest') || contains(inputs.command, 'poetry')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies (if needed)
        if: contains(inputs.command, 'pytest') || contains(inputs.command, 'python')
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "pyproject.toml" ]; then
            pip install poetry && poetry install
          fi

      # ===== GO SETUP =====
      - name: Setup Go (if needed)
        if: contains(inputs.command, 'go ')
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ===== RUST SETUP =====
      - name: Setup Rust (if needed)
        if: contains(inputs.command, 'cargo')
        uses: dtolnay/rust-toolchain@stable

      # ===== .NET SETUP =====
      - name: Setup .NET (if needed)
        if: contains(inputs.command, 'dotnet')
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ===== EXECUTE COMMAND =====
      - name: Execute command
        id: execute
        run: |
          echo "🚀 Executing: ${{ inputs.command }}"
          echo "📋 Command type: ${{ inputs.command_type }}"
          echo ""
          echo "=========================================="
          ${{ inputs.command }}
          echo "=========================================="
          echo ""
          echo "✅ Command completed successfully"

      - name: Report success
        if: success()
        run: |
          echo "::notice::✅ ${{ inputs.command_type }} completed successfully"

      - name: Report failure
        if: failure()
        run: |
          echo "::error::❌ ${{ inputs.command_type }} failed"
